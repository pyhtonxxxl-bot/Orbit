name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Keine Online-Abfragen der Expo CLI nötig, macht den Lauf stabiler.
      EXPO_OFFLINE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Web-Build (PC/Browser)
        run: npm run build:web
