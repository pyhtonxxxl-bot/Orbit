<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- Orbit hat ein eigenes helles Design: Browser dürfen es nicht automatisch abdunkeln
         (Chrome/Arc „Auto Dark Mode“, Erweiterung Dark Reader). -->
    <meta name="color-scheme" content="only light" />
    <meta name="darkreader-lock" />
    <!-- Reset nach react-native-web-Empfehlung, plus Orbit-Hintergrund und Fokus-Stile. -->
    <style id="expo-reset">
      :root {
        color-scheme: only light;
      }
      html,
      body {
        height: 100%;
        /* Weiß wie der Start-Bildschirm, damit beim Laden nichts grau aufblitzt. */
        background-color: #ffffff;
        /* Kein „Zurück“ und kein Gummiband beim seitlichen Wischen (z. B. über die Wisch-Leiste). */
        overscroll-behavior: none;
      }
      /* Dunkles Design (Einstellungen): Seitengrund und Bildlaufleisten dunkel, siehe src/lib/theme.tsx. */
      html.dark,
      html.dark body {
        background-color: #111111;
        color-scheme: dark;
      }
      html.dark * {
        scrollbar-color: rgba(255, 255, 255, 0.25) transparent;
      }
      body {
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      ::selection {
        background: rgba(228, 100, 43, 0.25);
      }
      /* Dezente Scrollleiste, passend zu den Graustufen. */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(0, 0, 0, 0.25) transparent;
      }
      /* Sichtbarer Tastatur-Fokus (nur bei Tab-Bedienung, nicht beim Klicken). Der Rahmen folgt der Rundung des Elements. */
      button:focus-visible,
      [role='button']:focus-visible,
      [role='checkbox']:focus-visible,
      [role='link']:focus-visible {
        outline: 2px solid rgba(228, 100, 43, 0.8);
        outline-offset: 2px;
      }
      /* Ganze Bänder (Tage am Handy, Werkzeuge): Fokusrahmen nach innen, sonst verdeckt ihn das nächste Band. */
      [role='button'][aria-expanded]:focus-visible,
      [role='link'][aria-label$='öffnen']:focus-visible {
        outline-offset: -4px;
      }
    </style>
    <!-- Gespeichertes Design sofort anwenden, damit beim Laden nichts hell aufblitzt. -->
    <script>
      try {
        var settings = JSON.parse(localStorage.getItem('orbit.settings.v1') || '{}');
        if (settings && settings.theme === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>

  <body>
    <noscript>Orbit braucht JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
